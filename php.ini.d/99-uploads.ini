; Project-scoped PHP settings for local development.
;
; The system php.ini caps uploads at 2M/8M, below the 10 MB survey limit.
; Apply this file without sudo by prepending it to PHP's ini scan directory:
;
;   PHP_INI_SCAN_DIR=/etc/php.d:$PWD/php.ini.d php artisan serve
;   PHP_INI_SCAN_DIR=/etc/php.d:$PWD/php.ini.d composer dev
;
; The scan directory must still include the system directory (/etc/php.d on
; this machine, /etc/php/conf.d on Debian/Ubuntu) so extensions keep loading.
;
; Server-wide alternative (requires sudo):
;   sudo cp php.ini.d/99-uploads.ini /etc/php.d/99-uploads.ini
;
; Behind nginx also raise: client_max_body_size 16m;

upload_max_filesize = 12M
post_max_size = 16M
